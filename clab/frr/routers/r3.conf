hostname r3
frr defaults datacenter
log stdout informational
service integrated-vtysh-config
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 10.255.0.3/32
 ipv6 address fd00:255::3/128
 ip router isis 1
 ipv6 router isis 1
 isis passive
exit
!
interface eth1
 ip address 10.1.13.2/30
 ipv6 address fd00:1:13::2/64
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 4
 link-params
  enable
  metric 10
  max-bw 1250000000
  max-rsv-bw 1250000000
  unrsv-bw 0 1250000000
  delay 100
  admin-grp 1
 exit-link-params
exit
!
interface eth2
 ip address 10.1.34.1/30
 ipv6 address fd00:1:34::1/64
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis circuit-type level-2
 isis metric 15
 isis hello-interval 1
 isis hello-multiplier 4
 link-params
  enable
  metric 15
  max-bw 1250000000
  max-rsv-bw 1250000000
  unrsv-bw 0 1250000000
  delay 200
  admin-grp 2
 exit-link-params
exit
!
interface eth3
 ip address 10.1.35.1/30
 ipv6 address fd00:1:35::1/64
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis circuit-type level-2
 isis metric 20
 isis hello-interval 1
 isis hello-multiplier 4
 link-params
  enable
  metric 20
  max-bw 1250000000
  max-rsv-bw 1250000000
  unrsv-bw 0 1250000000
  delay 400
  admin-grp 4
 exit-link-params
exit
!
interface eth4
 ip address 10.1.36.1/30
 ipv6 address fd00:1:36::1/64
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis circuit-type level-2
 isis metric 20
 isis hello-interval 1
 isis hello-multiplier 4
 link-params
  enable
  metric 20
  max-bw 1250000000
  max-rsv-bw 1250000000
  unrsv-bw 0 1250000000
  delay 400
  admin-grp 4
 exit-link-params
exit
!
router isis 1
 net 49.0001.0102.5500.0003.00
 is-type level-2-only
 metric-style wide
 hostname dynamic
 log-adjacency-changes
 topology ipv6-unicast
 lsp-gen-interval 5
 spf-interval 5
 mpls-te on
 mpls-te router-address 10.255.0.3
 mpls-te export
exit
!
router bgp 65000
 bgp router-id 10.255.0.3
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.1 description BGP-LS route reflector
 !
 address-family ipv4 unicast
  no neighbor 10.255.0.1 activate
 exit-address-family
 !
 address-family link-state
  neighbor 10.255.0.1 activate
 exit-address-family
exit
!
