hostname r1
frr defaults datacenter
log stdout informational
service integrated-vtysh-config
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 10.255.0.1/32
 ipv6 address fd00:255::1/128
 ip router isis 1
 ipv6 router isis 1
 isis passive
exit
!
interface eth1
 ip address 10.0.1.2/30
exit
!
interface eth2
 ip address 10.1.12.1/30
 ipv6 address fd00:1:12::1/64
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 4
 link-params
  enable
  metric 10
  max-bw 1250000000
  max-rsv-bw 1250000000
  unrsv-bw 0 1250000000
  delay 100
  admin-grp 1
 exit-link-params
exit
!
interface eth3
 ip address 10.1.13.1/30
 ipv6 address fd00:1:13::1/64
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 4
 link-params
  enable
  metric 10
  max-bw 1250000000
  max-rsv-bw 1250000000
  unrsv-bw 0 1250000000
  delay 100
  admin-grp 1
 exit-link-params
exit
!
interface eth4
 ip address 10.1.17.1/30
 ipv6 address fd00:1:17::1/64
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis circuit-type level-2
 isis metric 25
 isis hello-interval 1
 isis hello-multiplier 4
 link-params
  enable
  metric 25
  max-bw 125000000
  max-rsv-bw 125000000
  unrsv-bw 0 125000000
  delay 800
  admin-grp 8
 exit-link-params
exit
!
router isis 1
 net 49.0001.0102.5500.0001.00
 is-type level-2-only
 metric-style wide
 hostname dynamic
 log-adjacency-changes
 topology ipv6-unicast
 lsp-gen-interval 5
 spf-interval 5
 mpls-te on
 mpls-te router-address 10.255.0.1
 mpls-te export
exit
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 bgp cluster-id 10.255.0.1
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as 65000
 neighbor FABRIC update-source lo
 neighbor FABRIC timers 3 9
 neighbor COLLECTOR peer-group
 neighbor COLLECTOR remote-as 65000
 neighbor COLLECTOR description bgPLS collector
 neighbor COLLECTOR passive
 neighbor COLLECTOR timers 3 9
 neighbor 10.0.1.1 peer-group COLLECTOR
 neighbor 10.255.0.2 peer-group FABRIC
 neighbor 10.255.0.3 peer-group FABRIC
 neighbor 10.255.0.4 peer-group FABRIC
 neighbor 10.255.0.5 peer-group FABRIC
 neighbor 10.255.0.6 peer-group FABRIC
 neighbor 10.255.0.7 peer-group FABRIC
 neighbor 10.255.0.8 peer-group FABRIC
 !
 address-family ipv4 unicast
  no neighbor FABRIC activate
  no neighbor COLLECTOR activate
 exit-address-family
 !
 address-family link-state
  neighbor FABRIC activate
  neighbor FABRIC route-reflector-client
  neighbor COLLECTOR activate
 exit-address-family
exit
!
