hostname r2
frr defaults datacenter
log stdout informational
service integrated-vtysh-config
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 10.255.0.2/32
 ipv6 address fd00:255::2/128
 ip router isis 1
 ipv6 router isis 1
 isis passive
exit
!
interface eth1
 ip address 10.0.2.2/30
exit
!
interface eth2
 ip address 10.1.12.2/30
 ipv6 address fd00:1:12::2/64
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 4
 link-params
  enable
  metric 10
  max-bw 1250000000
  max-rsv-bw 1250000000
  unrsv-bw 0 1250000000
  delay 100
  admin-grp 1
 exit-link-params
exit
!
interface eth3
 ip address 10.1.24.1/30
 ipv6 address fd00:1:24::1/64
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 4
 link-params
  enable
  metric 10
  max-bw 1250000000
  max-rsv-bw 1250000000
  unrsv-bw 0 1250000000
  delay 100
  admin-grp 1
 exit-link-params
exit
!
interface eth4
 ip address 10.1.28.1/30
 ipv6 address fd00:1:28::1/64
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis circuit-type level-2
 isis metric 25
 isis hello-interval 1
 isis hello-multiplier 4
 link-params
  enable
  metric 25
  max-bw 125000000
  max-rsv-bw 125000000
  unrsv-bw 0 125000000
  delay 800
  admin-grp 8
 exit-link-params
exit
!
router isis 1
 net 49.0001.0102.5500.0002.00
 is-type level-2-only
 metric-style wide
 hostname dynamic
 log-adjacency-changes
 topology ipv6-unicast
 lsp-gen-interval 5
 spf-interval 5
 mpls-te on
 mpls-te router-address 10.255.0.2
 mpls-te export
exit
!
router bgp 65000
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.1 description BGP-LS route reflector
 neighbor 10.0.2.1 remote-as 65000
 neighbor 10.0.2.1 description bgPLS collector
 neighbor 10.0.2.1 passive
 neighbor 10.0.2.1 timers 3 9
 !
 address-family ipv4 unicast
  no neighbor 10.255.0.1 activate
  no neighbor 10.0.2.1 activate
 exit-address-family
 !
 address-family link-state
  neighbor 10.255.0.1 activate
  neighbor 10.0.2.1 activate
 exit-address-family
exit
!
