data_dir: /var/lib/bgpls

api:
  listen: 0.0.0.0:7443
  ui_listen: 0.0.0.0:8080
  metrics_listen: 0.0.0.0:9090
  tls:
    certificate: /etc/bgpls/pki/server.crt
    private_key: /etc/bgpls/pki/server.key
    allow_anonymous_reader: true
    client_cas:
      - /etc/bgpls/pki/ca.crt
  rbac:
    - role: admin
      uri_sans: ["spiffe://bgpls.lab/bgpls/admin/*"]
    - role: operator
      uri_sans: ["spiffe://bgpls.lab/bgpls/operator/*"]
    - role: reader
      uri_sans: ["spiffe://bgpls.lab/bgpls/reader/*"]

bgp:
  router_id: 10.255.0.254
  listen_port: -1

retention:
  duration: 720h
  max_bytes: 1073741824

utilization:
  stale_after: 45s
  sweep_after: 10m

domains:
  - id: core
    name: Core IS-IS fabric
    description: Mixed FRR and SR Linux Containerlab IS-IS domain exported over BGP-LS

peers:
  - id: r1
    domain_id: core
    name: FRR r1 BGP-LS producer
    remote_address: 10.0.1.2
    local_address: 10.0.1.1
    local_as: 65000
    remote_as: 65000
    source_preference: 100
    enabled: true
  - id: r2
    domain_id: core
    name: FRR r2 BGP-LS producer
    remote_address: 10.0.2.2
    local_address: 10.0.2.1
    local_as: 65000
    remote_as: 65000
    source_preference: 90
    enabled: true
