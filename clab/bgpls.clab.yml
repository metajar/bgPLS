# Eight FRR routers plus two SR Linux nodes in a dual-core / dual-edge IS-IS
# fabric, with a bgPLS collector.
#
#                    collector
#                   /         \
#                 r1 --------- r2
#                /  \         /  \
#              r3 -- r4     r5 -- r6
#               |  X  |     |  X  |
#              r7 ----+-----+---- r8
#               |                 |
#             srl1 ------------- srl2
#
# r1 and r2 originate the mixed FRR/SR Linux IS-IS TED over BGP-LS.
# srl1/srl2 are IS-IS only: 7220 IXR-D has no BGP-LS AFI and no MT-ISIS.
name: bgpls
prefix: clab

mgmt:
  network: bgpls-mgmt

topology:
  defaults:
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"

  kinds:
    nokia_srlinux:
      # ixr-d3l boots as a pizza box. ixr-6e is a chassis whose CPM/IMM are still
      # TENTATIVE when Containerlab applies startup-config, which closes sr_cli.
      type: ixr-d3l
      image: ghcr.io/nokia/srlinux:26.7.1-554

  nodes:
    collector:
      kind: linux
      image: bgpls:local
      ports:
        - 7443:7443/tcp
        - 8080:8080/tcp
        - 9090:9090/tcp
      env:
        COLLECTOR_ADDRS: eth1=10.0.1.1/30,eth2=10.0.2.1/30
      binds:
        - bgpls.yaml:/etc/bgpls/bgpls.yaml:ro
        - pki:/etc/bgpls/pki:ro
        - data:/var/lib/bgpls

    r1:
      kind: linux
      image: bgpls-frr:local
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
        - frr/routers/r1.conf:/etc/frr/frr.conf
    r2:
      kind: linux
      image: bgpls-frr:local
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
        - frr/routers/r2.conf:/etc/frr/frr.conf
    r3:
      kind: linux
      image: bgpls-frr:local
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
        - frr/routers/r3.conf:/etc/frr/frr.conf
    r4:
      kind: linux
      image: bgpls-frr:local
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
        - frr/routers/r4.conf:/etc/frr/frr.conf
    r5:
      kind: linux
      image: bgpls-frr:local
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
        - frr/routers/r5.conf:/etc/frr/frr.conf
    r6:
      kind: linux
      image: bgpls-frr:local
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
        - frr/routers/r6.conf:/etc/frr/frr.conf
    r7:
      kind: linux
      image: bgpls-frr:local
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
        - frr/routers/r7.conf:/etc/frr/frr.conf
    r8:
      kind: linux
      image: bgpls-frr:local
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
        - frr/routers/r8.conf:/etc/frr/frr.conf

    srl1:
      kind: nokia_srlinux
      startup-config: srl/srl1.cli
    srl2:
      kind: nokia_srlinux
      startup-config: srl/srl2.cli

    utilcol:
      kind: linux
      image: bgpls:local
      binds:
        - utilcol.yaml:/etc/bgpls/utilcol.yaml:ro
        - pki:/etc/bgpls/pki:ro
      entrypoint: /usr/local/bin/utilcol
      cmd: --config /etc/bgpls/utilcol.yaml

    tgen1:
      kind: linux
      image: bgpls-tgen:local
      exec:
        - ip link set eth1 mtu 1500
        - ip addr replace 10.10.1.2/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.10.2.0/24 via 10.10.1.1
    tgen2:
      kind: linux
      image: bgpls-tgen:local
      exec:
        - ip link set eth1 mtu 1500
        - ip addr replace 10.10.2.2/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.10.1.0/24 via 10.10.2.1

  links:
    # BGP-LS transport only (not in IS-IS)
    - endpoints: ["collector:eth1", "r1:eth1"]
    - endpoints: ["collector:eth2", "r2:eth1"]
    # Dual-core, dual-edge IS-IS fabric
    - endpoints: ["r1:eth2", "r2:eth2"]
    - endpoints: ["r1:eth3", "r3:eth1"]
    - endpoints: ["r1:eth4", "r7:eth1"]
    - endpoints: ["r2:eth3", "r4:eth1"]
    - endpoints: ["r2:eth4", "r8:eth1"]
    - endpoints: ["r3:eth2", "r4:eth2"]
    - endpoints: ["r3:eth3", "r5:eth1"]
    - endpoints: ["r3:eth4", "r6:eth1"]
    - endpoints: ["r4:eth3", "r5:eth2"]
    - endpoints: ["r4:eth4", "r6:eth2"]
    - endpoints: ["r5:eth3", "r6:eth3"]
    - endpoints: ["r5:eth4", "r7:eth2"]
    - endpoints: ["r6:eth4", "r8:eth2"]
    - endpoints: ["r7:eth3", "r8:eth3"]
    # SR Linux edge pair
    - endpoints: ["r7:eth4", "srl1:ethernet-1/1"]
    - endpoints: ["r8:eth4", "srl2:ethernet-1/1"]
    - endpoints: ["srl1:ethernet-1/2", "srl2:ethernet-1/2"]
    - endpoints: ["tgen1:eth1", "r1:eth5"]
      mtu: 1500
    - endpoints: ["tgen2:eth1", "srl2:ethernet-1/3"]
      mtu: 1500
